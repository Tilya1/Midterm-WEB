<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AniVerse - Contact</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <header class="header">
        <a href="index.html" class="logo">
            <img src="images/logo.jpg" alt="AniVerse logo">
            <span>AniVerse</span>
        </a>
        <nav class="nav">
            <a href="index.html">Home</a>
            <a href="anime.html">Anime</a>
            <a href="manga.html">Manga</a>
            <a href="top.html">Top</a>
            <a href="gallery.html">Gallery</a>
            <a href="contact.html" class="active">Contact</a>
        </nav>
    </header>

    <main>
        <div class="container">
            <h1 class="title">Join the Club</h1>
            <p class="mb-4">Fill the form and become a member of AniVerse fan club.</p>

            <div class="row">
                <div class="col-12 col-lg-7 mb-4">
                    <form class="form-box">
                        <label for="name">Name</label>
                        <input type="text" id="name" placeholder="Your name" required>

                        <label for="email">Email</label>
                        <input type="email" id="email" placeholder="you@mail.com" required>

                        <label for="anime">Favourite anime</label>
                        <select id="anime">
                            <option>One Piece</option>
                            <option>Naruto</option>
                            <option>Attack on Titan</option>
                            <option>Haikyuu!!</option>
                            <option>Blue Lock</option>
                            <option>Solo Leveling</option>
                            <option>Hunter x Hunter</option>
                            <option>Dr. Stone</option>
                            <option>Death Note</option>
                            <option>Jujutsu Kaisen</option>
                            <option>Vinland Saga</option>
                        </select>

                        <label for="message">Message</label>
                        <textarea id="message" rows="4" placeholder="Why do you love anime?"></textarea>

                        <button type="submit" class="btn-anime mt-3">Send</button>
                    </form>
                </div>

                <div class="col-12 col-lg-5">
                    <div class="form-box">
                        <h3 class="h5 title">Contacts</h3>
                        <p>Address: Astana, Mangilik El 55/11</p>
                        <p>Email: aniverse@mail.com</p>
                        <p>Phone: +7 700 000 00 00</p>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <footer class="footer">
        <p>dzma54980@gmail.com</p>
        <p>Authors: Zh.Aktilek B.Alibek A.Meiirkhan</p>
    </footer>

</body>
</html>
